# Production single-host deployment stack: apps/api + Postgres + Redis + Migration Runner + Reverse Proxy
#
# Unlike the development docker-compose.yml, this compose file:
# 1. Uses the multi-stage, hardened, non-root apps/api/Dockerfile image.
# 2. Includes a dedicated `migration` service running `db:migrate:deploy` before API boots.
# 3. Mounts NO host development source code or local node_modules.
# 4. Features a fronting reverse proxy (Nginx) for edge TLS termination and rate limit headers.
#
# See docs/guides/deployment.md for prerequisite setup, secrets, and operations.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verixa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-verixa}
    volumes:
      - verixa-prod-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/02-init-app-role.sh:/docker-entrypoint-initdb.d/02-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - verixa-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else
               redis-server --appendonly yes;
             fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - verixa-prod-redis-data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
                 redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG;
               else
                 redis-cli ping | grep -q PONG;
               fi'
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - verixa-internal

  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    restart: "no"
    command: pnpm --filter @verixa/database run db:migrate:deploy
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL (with owner credentials) is required for migrations}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - verixa-internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - verixa-internal
    expose:
      - "3000"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - verixa-internal

volumes:
  verixa-prod-postgres-data:
  verixa-prod-redis-data:

networks:
  verixa-internal:
    driver: bridge
